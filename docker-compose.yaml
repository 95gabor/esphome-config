services:
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145
    privileged: true
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 6052:6052
    environment:
      - ESPHOME_DASHBOARD_USE_PING=true
