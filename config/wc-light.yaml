esphome:
  name: sonoff-wc
  friendly_name: WC light

esp8266:
  board: sonoff_basic

# Enable logging
logger:

# Enable Home Assistant API
api:
  # encryption:
  #   key: !secret secure_device_api_key

ota:
  - platform: esphome
    # password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Fallback hotspot if the WiFi connection fails
  ap:
    password: !secret wifi_password

# Enable web server
web_server:
  port: 80
  # auth:
  #   username: !secret secure_device_web_username
  #   password: !secret secure_device_web_password

switch:
  - platform: gpio
    id: relay
    name: "WC light"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "WC light button"
    on_click:
      # Short press: toggle the light
      - min_length: 50ms
        max_length: 1s
        then:
          - switch.toggle: relay
      # Long press: restart the device
      - min_length: 3s
        max_length: 10s
        then:
          - button.press: restart_button

sensor:
  - platform: wifi_signal
    name: "WC light WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "WC light uptime"

button:
  - platform: restart
    id: restart_button
    name: "WC light restart"

status_led:
  pin:
    number: GPIO13
    inverted: true
