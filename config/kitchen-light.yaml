esphome:
  name: sonoff-kitchen
  friendly_name: Kitchen light

esp8266:
  board: sonoff_basic

# Enable logging
logger:

# Enable Home Assistant API
api:
  # encryption:
  #   key: !secret secure_device_api_key

ota:
  - platform: esphome
    # password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable web server
web_server:
  port: 80
  # auth:
  #   username: !secret secure_device_web_username
  #   password: !secret secure_device_web_password

switch:
  - platform: gpio
    id: relay
    name: "Kitchen light"
    pin: GPIO12
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Kitchen light button"
    on_press:
      - switch.toggle: relay

status_led:
  pin:
    number: GPIO13
    inverted: true
